[package]
name = "binloom"
version = "0.1.0"
edition = "2024"
authors = ["Kacper 'Obryko' Obrycki <kacperobrycki@gmail.com>"]
description = "Repository-local manager for pinned developer tools"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Obryko/binloom"
readme = "README.md"
keywords = ["toolchain", "developer-tools", "reproducible", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
clap = {version = "4.0", features = ["derive"]}
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking","json","rustls"] }
sha2 = "0.11.0"
time = { version = "0.3.55", features = ["parsing"] }
tempfile = { version = "3.27.0" }
flate2 = "1.1.9"

