[package]
name = "binloom"
version = "0.3.0"
edition = "2024"
authors = ["Kacper 'Obryko' Obrycki <kacperobrycki@gmail.com>"]
description = "Repository-local manager for pinned developer tools"
license = "MIT OR Apache-2.0"
repository = "https://github.com/KyrboForge/binloom"
readme = "README.md"
keywords = ["toolchain", "developer-tools", "reproducible", "cli"]
categories = ["command-line-utilities", "development-tools"]

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
sha2 = "0.11.0"
time = { version = "0.3.55", features = ["parsing"] }
tempfile = { version = "3.27.0" }
flate2 = "1.1.9"
toml_edit = { version = "0.25.13", default-features = false, features = ["parse", "display"] }
ureq = { version = "3.4.0", default-features = false, features = ["rustls", "json"] }

