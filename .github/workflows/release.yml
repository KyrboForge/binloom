name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix, for example 0.2.1
        required: true
        type: string

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      commit: ${{ steps.release.outputs.commit }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - uses: KyrboForge/actions/release-token@749e48b925f1911fa8fee07ef98403acb2718570
        id: release-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.release-token.outputs.token }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Update version and verify
        id: release
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "invalid release version: $RELEASE_VERSION" >&2
            exit 1
          fi

          release_tag="v${RELEASE_VERSION}"
          if git rev-parse --verify --quiet "refs/tags/${release_tag}" >/dev/null; then
            echo "tag ${release_tag} already exists" >&2
            exit 1
          fi

          current_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [ "$current_version" != "$RELEASE_VERSION" ]; then
            perl -0pi -e 's/^version = "[^"]+"/version = "$ENV{RELEASE_VERSION}"/m' Cargo.toml
            cargo check
          fi

          manifest_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          test "$manifest_version" = "$RELEASE_VERSION"
          cargo test --all-targets --locked

          if ! git diff --quiet -- Cargo.toml Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.toml Cargo.lock
            git commit -m "chore: release ${release_tag}"
            git push origin HEAD:main
          fi

          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            builder: cargo
            asset: binloom_macos_aarch64

          - runner: macos-14
            target: x86_64-apple-darwin
            builder: cargo
            asset: binloom_macos_x86_64

          - runner: ubuntu-latest
            target: aarch64-unknown-linux-musl
            builder: cross
            asset: binloom_linux_aarch64

          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            builder: cross
            asset: binloom_linux_x86_64

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - if: matrix.builder == 'cross'
        uses: taiki-e/install-action@cross

      - name: Build
        run: ${{ matrix.builder }} build --release --locked --target ${{ matrix.target }}

      - name: Compress
        run: |
          gzip -9c \
            target/${{ matrix.target }}/release/binloom \
            > ${{ matrix.asset }}.gz

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.gz
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate wrapper
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          sed "s/@BINLOOM_VERSION@/${RELEASE_VERSION}/g" \
            src/binloomw.sh > dist/binloomw

          chmod 755 dist/binloomw

          grep -q "BINLOOMW_VERSION=\"${RELEASE_VERSION}\"" dist/binloomw
          if grep -q "@BINLOOM_VERSION@" dist/binloomw; then
            echo "wrapper still contains version placeholder" >&2
            exit 1
          fi

          sh -n dist/binloomw

      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.gz binloomw > SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.commit }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.gz
            dist/binloomw
            dist/SHA256SUMS

  publish-crate:
    name: Publish crate
    needs:
      - prepare
      - release
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
