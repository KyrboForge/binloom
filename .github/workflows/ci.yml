name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format and lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@cargo-audit

      - name: Audit dependencies
        run: cargo audit
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Validate wrapper and schemas
        run: |
          sh -n bootstrap.sh
          sh -n src/binloomw.sh
          shellcheck bootstrap.sh
          shellcheck src/binloomw.sh
          jq empty schemas/binloom.schema.json

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - if: matrix.os == 'ubuntu-latest'
        run: rustup component add llvm-tools-preview
      - if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Run tests with coverage
        if: matrix.os == 'ubuntu-latest'
        run: cargo llvm-cov --all-targets --locked --cobertura --output-path coverage.xml --fail-under-lines 60
      - name: Run tests
        if: matrix.os != 'ubuntu-latest'
        run: cargo test --all-targets --locked
